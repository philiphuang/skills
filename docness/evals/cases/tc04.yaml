id: tc04
description: tencent-doc → collect
input:
  prompt: /docness https://docs.qq.com/doc/DVG9MRXlYanFrblJh
  timeout_seconds: 600
constraints:
  timeout_seconds: 600
criteria:
- 成功把腾讯文档内容保存到知识库目录
expect:
  exit_code: 0
  files_exist: &id001
  - 知识库/
success_rules:
- exit_code: 0
- files_exist: *id001
failure_rules:
- exit_code: 1
- exit_code: 137
