# 通用项目映射表 / projects-map（示例模板——所有项目均为虚构演示数据）
#
# 正式配置保存在用户命名空间 ~/.config/project-daimon/projects-map.yaml（project-daimon
# 命名空间的通用「项目 → 目录/关键词」映射，跨工具共享；qianwen-minutes-sync 管线是消费方之一）。
# 由 scripts/gen_projects_map.py 生成与合并，本文件仅作 --init-from 种子/格式示例。
# 管线按 keywords 匹配纪要标题 → 命中条目归档到 archive_dir；无命中 → 待分拣收件箱并提醒。
# schema v1 已由 #108 锁定（归档/命名/front-matter/schema 规范见 references/archive-spec.md）；
# 维护方式：重跑 gen_projects_map 或手工增删条目，映射是唯一分类事实源。
#
# 匹配规则（v1）：
#   - 仅匹配纪要标题（是否引入正文匹配由 #109 决策票定）
#   - 按本文件顺序取首个命中条目
#   - archive_dir 为空的命中条目 → 走待分拣（占位：项目归属未定，确认后补路径）

version: 1

# 不想被 gen_projects_map 自动收录的目录名（工具目录/日志目录等），收录后可手工挪进来
exclude:
  - SOP
  - chat_logs

defaults:
  # 待分拣收件箱：管线运行现场所在 workspace（部署环境自定）
  inbox_dir: ~/projects/收件箱/待分类
  match: title

projects:
  - id: demo-platform
    name: 示例平台
    project_dir: ~/projects/9901示例平台
    archive_dir: ~/projects/9901示例平台/归档/纪要
    keywords: [示例平台, 架构评审, 需求调研, 智能体融合]
    # 完整条目示例：编号目录 + 归档子目录 + 多关键词。

  - id: demo-agent
    name: 工单助手（示例）
    project_dir: ~/projects/9902示例助手
    archive_dir: ~/projects/9902示例助手/工单分类/纪要
    keywords: [工单助手, 工单分类]
    # 同一 workspace 下子目录作归档目标的示例。

  - id: demo-pending
    name: 待定项目（示例）
    project_dir: null
    archive_dir: null
    keywords: [待定]
    # archive_dir/project_dir 为空 → 命中也走待分拣；确认归属后补齐两字段。
