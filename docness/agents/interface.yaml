# Agent Interface

## Entry

Slash command `/docness` defined in `.opencode/commands/docness.md`.

## Workflow

1. Agent receives user input (URL, file path, or text with trigger words)
2. Call `scripts/dispatch.py` to identify input type and intent
3. Route to the appropriate SOP (collect / process / send)
4. Execute SOP steps, calling external skills as needed
5. Report result summary to user

## Tool Contract

### dispatch.py

```
python -m docness.scripts.dispatch <input>
```

Returns JSON: `{"source_type": "...", "intent": "collect|process|send", "matched": {...}}`

### classify.py

```
python -m docness.scripts.classify <markdown_file> [--categories <path>] [--kb-dir <path>]
```

Returns JSON: `{"category": "...", "confidence": "high|low", "reason": "..."}`

### state.py

```
python -m docness.scripts.state read <file>           # read front matter
python -m docness.scripts.state write <file> <key> <value>  # set field
python -m docness.scripts.state log <action> <detail>  # append to daily log
```

### index.py

```
python -m docness.scripts.index add <path> <entry_json>
python -m docness.scripts.index find --category <name>
python -m docness.scripts.index find --source <url>
python -m docness.scripts.index rebuild
```

## State Model

Files tracked via YAML front matter + `知识库/docness-index.yml`.

Front matter schema: `references/front-matter-schema.md`

## Error Boundary

- Unknown URL → report supported sources, ask user
- Missing skill → report missing skill name, suggest install
- Classification uncertain → ask user
- Skill invocation fails → preserve intermediates, log error, suggest retry
